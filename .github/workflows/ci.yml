name: CI — Build Check

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

jobs:
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            agent/package-lock.json

      - name: Install backend dependencies
        run: npm install --omit=optional
        working-directory: backend

      - name: Install agent dependencies
        run: npm install --omit=optional
        working-directory: agent

  backend-checks:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISTRO: ubuntu-22.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      # In-memory MongoDB for the real-database tests (same major version as Atlas)
      - name: Cache MongoDB test binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.4-ubuntu-22.04

      - name: Lint (errors fail the build)
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Known vulnerabilities (report only)
        run: npm audit --omit=dev --audit-level=high || true
